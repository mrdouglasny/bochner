      module: "Minlos.PietschBridge"
      status: "proved"
      note: "Pietsch nuclear expansion → Hilbertian seminorms via a Hilbertian lift + Bessel inequality."
    - source: "ISBN:978-1-4704-2662-5"
      lean: "white_noise_measure_exists"
      module: "Test.WhiteNoise"
      status: "proved"
      note: "Demo: Minlos applied to white-noise CF on S'(ℝ); depends on 4 Test-only Schwartz axioms."

