# 4 instance-provider axioms confined to the Test/ white-noise demo).
version: "v0.3"

project:
  name: "bochner"
  authors: ["Michael R. Douglas"]
  license: "Apache-2.0"

sources:
  - title: "Generalized Functions, Volume 4: Applications of Harmonic Analysis"
    authors: ["I. M. Gel'fand", "N. Ya. Vilenkin"]
    id: "ISBN:978-1-4704-2662-5"
    type: "textbook"
    license: "proprietary"
    note: "Nuclear spaces (Hilbertian seminorm characterization) and Minlos' theorem; Chapters 3-4."
  - title: "Generalized random processes and their extension to a measure"
    authors: ["R. A. Minlos"]
    id: "ISBN:978-0-8218-1054-5"
    type: "paper"
    license: "proprietary"
    note: >
      Original 1959 Minlos paper (Trudy Moskov. Mat. Obshch. 8, 497-518).
      No DOI located; using Bogachev 'Gaussian Measures' ISBN as the
      durable bibkey for the Minlos/characteristic-functional material it covers.
  - title: "Topological Vector Spaces, Distributions and Kernels"
    authors: ["François Trèves"]
    id: "ISBN:978-0-486-45352-1"
    type: "textbook"
    license: "proprietary"
